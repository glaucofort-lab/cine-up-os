    function checklist(){setTimeout(bindOperation);const l=loc(),d=today(),area=AREAS.find(a=>a.id===state.areaId),locUsers=USERS.filter(u=>u.locations.includes(l.id)&&u.role!=="director"),lt=tasks.filter(t=>t.locId===l.id&&t.date===d),my=lead(state.user)?lt:lt.filter(t=>t.assigneeId===state.user.id);return`<main class="content"><h1 class="pageTitle">Checklist</h1>${lead(state.user)?`<section class="panel"><h2>☑ Checklist com evidência</h2><div class="seg">${["Abertura","1º Pico","2º Pico"].map(r=>`<button data-round="${r}" class="${state.round===r?"active":""}">${r}</button>`).join("")}</div><select id="areaSel">${AREAS.map(a=>`<option value="${a.id}" ${a.id===state.areaId?"selected":""}>${a.name}</option>`).join("")}</select>${area.items.map((txt,i)=>checkItem(area.id,i,txt)).join("")}<button class="primary" id="saveCheck">Salvar vistoria da área</button></section><section class="panel"><h2>👤 Delegar tarefas de ${DAY_LABEL[dayKey()]}</h2><p class="muted">O calendário já filtra as tarefas do dia. As tarefas diárias aparecem todos os dias.</p>${SECTORS.map(sec=>{const todays=sec.tasks.filter(taskApplies);return todays.length?`<div class="historyCard"><strong>${sec.name}</strong>${todays.map((task,i)=>delegateRow(sec,task,i,locUsers,lt)).join("")}</div>`:""}).join("")}</section>`:""}<section class="panel"><h2>▣ Tarefas com foto</h2>${my.length?my.map(taskRow).join(""):`<p class="muted">Nenhuma tarefa para hoje.</p>`}</section></main>`}

    function pointSeq(){return["Entrada","Pausa","Retorno","Pausa","Retorno","Saída"]}

    function pointStatusText(records){if(!records.length)return"Não iniciou";const last=records[records.length-1]?.type;if(last==="Saída")return"Jornada encerrada";if(last==="Pausa")return"Em pausa";if(last==="Entrada"||last==="Retorno")return"Em jornada";return"Em andamento"}
    function pointTime(p){return new Date(p.createdAt).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
    function pointView(){setTimeout(bindPoint);const seq=pointSeq(),mine=pointRecords.filter(p=>p.userId===state.user.id&&p.date===today()).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),next=pointLabel(mine),pct=Math.round(Math.min(mine.length,seq.length)/seq.length*100),team=USERS.filter(u=>u.locations.includes(state.locId)&&u.role!=="director"),locPoints=pointRecords.filter(p=>p.locId===state.locId&&p.date===today());return`<main class="content"><h1 class="pageTitle">Ponto</h1><p class="moduleIntro">Registre cada etapa no momento real: Entrada, Pausa, Retorno, Pausa, Retorno e Saída.</p><section class="pointStatus"><small>Status atual</small><strong>${pointStatusText(mine)}</strong><div class="progressLine"><span style="width:${pct}%"></span></div><p class="pointNote">${next==="Jornada completa"?"Todos os registros obrigatórios foram concluídos.":`Próxima ação: ${next}`}</p></section><section class="panel"><h2>◷ Registro de hoje</h2><div class="pointGrid">${seq.map((label,i)=>`<button data-point="${label}" class="${i<mine.length?"done":label===next?"next":""}" ${i!==mine.length?"disabled":""}>${i<mine.length?"✓ ":""}${label}</button>`).join("")}</div><p class="pointNote">O sistema bloqueia registros fora da ordem para evitar inconsistência.</p></section><section class="panel"><h2>Histórico do dia</h2>${mine.length?mine.map((p,i)=>`<div class="historyCard"><strong>${i+1}. ${p.type}</strong><small>${pointTime(p)} · ${p.locName}</small></div>`).join(""):`<p class="muted">Nenhum registro hoje.</p>`}</section>${lead(state.user)?`<section class="panel"><h2>Equipe hoje</h2>${team.map(u=>{const rec=locPoints.filter(p=>p.userId===u.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));return`<div class="rank"><span>${u.name}<small style="display:block;color:#667085">${rec.length?rec.map(r=>`${r.type} ${pointTime(r)}`).join(" · "):"Sem registro"}</small></span><strong>${pointStatusText(rec)}</strong></div>`}).join("")}</section>`:""}</main>`}
    function bindPoint(){document.querySelectorAll("[data-point]").forEach(b=>b.onclick=()=>{const mine=pointRecords.filter(p=>p.userId===state.user.id&&p.date===today()).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),expected=pointLabel(mine);if(b.dataset.point!==expected||expected==="Jornada completa")return;pointRecords=[...pointRecords,{id:`${state.user.id}_${Date.now()}`,userId:state.user.id,userName:state.user.name,locId:state.locId,locName:loc().name,date:today(),type:expected,createdAt:new Date().toISOString()}];save("cineup_point_v1",pointRecords);render()})}

    function pendingPriority(item){const text=norm(`${item.text||item.title||""} ${item.sectorName||""}`);if(/projetor|luz|atm|impressora|computador|maquina|máquina|audio|áudio|vencido|segurança|dinheiro/.test(text))return"high";if(/refazer|submitted|aguardando|manut|checklist|fechamento/.test(text)||item.status==="redo"||item.status==="submitted")return"medium";return"low"}

    function assistantAnswer(q){const s=norm(q),name=state.user?.name||"colaborador";let title="Orientação Cine UP",body="Quando tiver dúvida, siga o padrão: pare, confira o procedimento da área, registre evidência se houver risco operacional e acione a liderança quando envolver cliente, dinheiro, segurança, equipamento ou produto vencido.",actions=["Consultar treinamento","Registrar pendência se necessário"];if(/ponto|entrada|pausa|retorno|saida|saída/.test(s)){title="Ponto";body="A ordem correta do ponto é: Entrada, Pausa, Retorno, Pausa, Retorno e Saída. Registre cada etapa no momento real em que ela acontece. Se esquecer algum registro, avise a liderança para correção.";actions=["Abrir Ponto","Avisar liderança"]}else if(/estoque|contagem|validade|vencido|fifo|peps|perda|defeito/.test(s)){title="Estoque";body="Na contagem, confira o local físico aberto, registre a quantidade real e separe produtos vencidos, com defeito ou próximos do vencimento. Para bebidas e doces, use PEPS/FIFO: primeiro sai o que vence antes. Perda e defeito devem ser movimento separado, nunca venda.";actions=["Abrir Estoque","Registrar perda/defeito"]}else if(/check|checklist|vistoria|pendência|pendência|foto|evidencia|evidência/.test(s)){title="Checklist";body="No checklist, foto não substitui avaliação. Marque OK apenas quando o padrão estiver correto. Se houver inconformidade, marque Pendência, descreva o problema e anexe evidência. Pendências técnicas podem virar manutenção.";actions=["Abrir Checklist","Criar ação corretiva"]}else if(/plano|chao|chão|posicao|posição|setor|setorizacao|setorização/.test(s)){title="Plano de chão";body="O plano de chão organiza cada pessoa por posição real da operação: Bomboniere, Pipoqueira, Portaria, Foyer, Apoio, Salas e Zeladoria. Gerente, subgerente ou treinador montam o plano; funcionário consulta a própria posição.";actions=["Abrir Plano de chão","Ver posição do turno"]}else if(/cliente|atendimento|reclamacao|reclamação|ingresso|fila/.test(s)){title="Atendimento";body=`${name}, no atendimento o padrão é ouvir primeiro, manter postura calma, resolver o que estiver no seu alcance e chamar a liderança quando envolver reembolso, conflito, reclamação formal, classificação indicativa ou problema de sessão.`;actions=["Consultar Atendimento","Chamar liderança"]}else if(/oculos|óculos|3d|higienizacao|higienização/.test(s)){title="Óculos 3D";body="Óculos 3D devem estar limpos, secos, higienizados e embalados. Se encontrar óculos danificado, separe do uso e registre como pendência ou baixa conforme orientação da liderança.";actions=["Abrir Checklist","Registrar pendência"]}else if(/fechamento|fechar|fim do dia/.test(s)){title="Fechamento";body="No fechamento, siga por setor: bomboniere/estoque, foyer/banheiros/salas e sala de óculos. Desligue equipamentos definidos, confira limpeza, trancas, luzes, ar-condicionado, ATMs e registre pendências antes de encerrar.";actions=["Abrir Checklist","Ver tarefas de fechamento"]}else if(/treinamento|ficha|reciclagem|duvida|dúvida/.test(s)){title="Treinamento";body="Fichas e treinamentos ficam disponíveis para reciclagem. Use quando surgir dúvida de procedimento, postura, operação de setor ou padrão Cine UP. Liderança e treinador podem criar e revisar materiais.";actions=["Abrir Treinamento","Abrir Fichas"]}return{title,body,actions}}

    function minutesNow(){const d=new Date();return d.getHours()*60+d.getMinutes()}
    function toMin(hhmm){const [h,m]=String(hhmm||"00:00").split(":").map(Number);return h*60+m}
    function endMin(s){return toMin(s.start)+(Number(s.duration)||120)}
    function movieDate(s){return s.date||today()}
    function todayMovies(){return movieSchedule.filter(s=>(s.locId||state.locId)===state.locId&&movieDate(s)===today()).sort((a,b)=>toMin(a.start)-toMin(b.start))}
    function upcomingMovieDay(){const future=movieSchedule.filter(s=>(s.locId||state.locId)===state.locId&&movieDate(s)>=today()).sort((a,b)=>movieDate(a).localeCompare(movieDate(b))||toMin(a.start)-toMin(b.start)),date=future[0]?movieDate(future[0]):"";return future.filter(s=>movieDate(s)===date)}
    function visibleMovies(){const list=todayMovies();return list.length?list:upcomingMovieDay()}
    function visibleMovieLabel(){const list=todayMovies();if(list.length)return"Programacao de hoje";const next=upcomingMovieDay()[0];return next?`Proxima programacao · ${movieDate(next).split("-").reverse().join("/")}`:"Programacao de hoje"}
    function sessionStatus(s){const now=minutesNow(),start=toMin(s.start),end=endMin(s);if(now>=start&&now<=end)return"live";if(now<start)return"next";return"done"}
    function currentSession(){const list=todayMovies(),now=minutesNow();return list.find(s=>now>=toMin(s.start)&&now<=endMin(s))||list.find(s=>toMin(s.start)>now)||list[list.length-1]}
    function shiftMoment(){const list=todayMovies(),now=minutesNow(),first=list[0]?toMin(list[0].start):14*60,last=list[list.length-1]?endMin(list[list.length-1]):23*60,next=list.find(s=>toMin(s.start)>now),live=list.find(s=>now>=toMin(s.start)&&now<=endMin(s));if(now<first-45)return{label:"Pre-abertura",detail:"Preparar foyer, bomboniere, salas, ponto e plano de chao"};if(now<first+30)return{label:"Abertura",detail:"Primeira entrada do dia, conferencia de salas e atendimento inicial"};if(live)return{label:"Sessao em andamento",detail:`${live.title} · ${live.room} · termina ${minToTime(endMin(live))}`};if(next&&toMin(next.start)-now<=45)return{label:"Pico de entrada",detail:`Preparar fila, combos, oculos e portaria para ${next.start}`};if(now>last-30)return{label:"Fechamento",detail:"Conferir salas, estoque, limpeza, caixas e pendências"};return{label:"Operação entre sessoes",detail:"Reposicao, limpeza, inspecoes e preparacao da proxima entrada"}}
    function minToTime(m){return`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`}
    function sessionAlarmText(s){const now=minutesNow(),start=toMin(s.start),end=endMin(s),before=start-now,beforeEnd=end-now;if(before>0&&before<=20)return`Em ${before} min: inicio de ${s.title} (${s.room})`;if(beforeEnd>0&&beforeEnd<=15)return`Em ${beforeEnd} min: termino de ${s.title} (${s.room})`;if(now>=start&&now<=start+5)return`Sessao iniciando agora: ${s.title} (${s.room})`;if(now>=end&&now<=end+5)return`Sessao encerrando agora: ${s.title} (${s.room})`;return""}

    function reports(){const lt=tasks.filter(t=>t.locId===state.locId),todayTasks=lt.filter(t=>t.date===today()),approved=lt.filter(t=>t.status==="approved").length,submitted=lt.filter(t=>t.status==="submitted").length,openTasks=lt.filter(t=>["pending","redo"].includes(t.status)).length,latest=latestCount(),value=latest?latest.items.reduce((s,i)=>s+i.qty*(PRODUCTS.find(p=>p.id===i.productId)?.price||0),0):0,locMov=movements.filter(m=>m.locId===state.locId),loss=locMov.filter(m=>m.type==="perda").reduce((s,m)=>s+Number(m.qty||0),0),locTickets=tickets.filter(t=>t.locId===state.locId),locChecks=checks.filter(c=>c.locId===state.locId),avgCheck=locChecks.length?Math.round(locChecks.reduce((s,c)=>s+(c.score||0),0)/locChecks.length):0,people=USERS.filter(u=>u.locations.includes(state.locId));return`<main class="content"><h1 class="pageTitle">Relatorios</h1><p class="moduleIntro">Leitura gerencial da operação local: tarefas, checklist, estoque, chamados e equipe.</p><section class="metricGrid">${metric("Tarefas hoje",todayTasks.length,"gold","☑")}${metric("Aguardando aprovacao",submitted,submitted?"red":"green","✓")}${metric("Pendentes",openTasks,openTasks?"red":"green","!")}${metric("Estoque estimado",money(value),"blue","□")}</section><section class="focusGrid">${reportLine("Checklist medio",`${avgCheck}%`,`${locChecks.length} vistoria(s) salvas`,avgCheck>=85?"green":"hot")}${reportLine("Tarefas aprovadas",approved,"Histórico da praca","green")}${reportLine("Perdas registradas",loss,"Unidades em movimentos de perda",loss?"red":"green")}${reportLine("Chamados",locTickets.length,`${locTickets.filter(t=>t.status!=="done").length} aberto(s)`,locTickets.some(t=>t.status!=="done")?"red":"green")}</section><section class="panel"><h2>Ranking operacional</h2>${people.map(u=>{const st=userStats(u),ok=lt.filter(t=>t.assigneeId===u.id&&t.status==="approved").length;return`<div class="rank"><span>${u.name}<small style="display:block;color:#667085">${ROLE[u.role]} - ponto ${st.points}/ </p><div class="formGrid"><select id="placeSel">${PLACES.map(p=>`<option ${p===state.place?"selected":""}>${p}</option>`).join("")}</select><select id="catSel">${cats.map(c=>`<option ${c===state.cat?"selected":""}>${c}</option>`).join("")}</select></div><div class="stockTools"><button id="fillMin">Preencher mínimo da categoria/local</button><button id="clearCat">Zerar categoria/local</button></div>${visible.map(p=>{const q=Number(getQty(state.place,p.id))||0,track=["Chocolates","Balas e Gummies","Bebidas"].includes(productGroup(p)),lots=getLots(state.place,p.id);return`<div class="stockRow ${q<p.min?"low":""}"><div><strong>${esc(p.name)}</strong><small>${esc(productGroup(p))} - ${esc(state.place)} - mínimo ${p.min}${canMoney&&p.price?` - R$ ${p.price}`:""}</small>${track?`<div class="lotBox"><strong>Validades/lotes</strong><div class="lotList">${lots.length?lots.map((l,idx)=>`${l.qty} un. - ${l.date} <button class="smallBtn" data-remove-lot="${p.id}" data-lot-index="${idx}">remover</button>`).join("<br>"):"Nenhuma validade registrada."}</div><div class="lotForm"><input type="number" placeholder="Qtd" data-lot-qty="${p.id}"><input type="date" data-lot-date="${p.id}"><button class="smallBtn" data-add-lot="${p.id}">Add</button></div></div>`:""}</div><input type="number" data-qty="${p.id}" value="${esc(getQty(state.place,p.id)??"")}"></div>`}).join("")}<button class="primary" id="saveCount">Salvar contagem do local</button></section>${exp.length?`<section class="panel danger"><h2>Validade / FIFO</h2>${exp.map(i=>`<div class="alertLine"><strong>${esc(i.product?.name||"Produto")}</strong> - ${esc(i.place)} - lote ${i.lotQty} un. - ${i.days<0?"vencido":`vence em ${i.days} dia(s)`} - ${esc(i.expiry)}</div>`).join("")}</section>`:""}<section class="panel"><h2>Movimentos de estoque</h2><div class="movementGrid"><select id="movType"><option value="entrada" ${state.movementType==="entrada"?"selected":""}>Entrada</option><option value="perda" ${state.movementType==="perda"?"sele     function bindInventory(){document.getElementById("placeSel").onchange=e=>{state.place=e.target.value;state.aiProfile=suggestStandardForPlace(e.target.value);render()};document.getElementById("catSel").onchange=e=>set({cat:e.target.value});const prof=document.getElementById("aiProfile");if(prof)prof.onchange=e=>{state.aiProfile=e.target.value};const photo=document.getElementById("aiCountPhoto");if(photo)photo.onchange=e=>{state.aiCountPhoto=e.target.files?.[0]?.name||""};const ai=document.getElementById("applyAiCount");if(ai)ai.onclick=()=>{applyInventoryStandard(document.getElementById("aiProfile")?.value||suggestStandardForPlace());render()};document.querySelectorAll("[data-qty]").forEach(i=>i.oninput=()=>setQty(state.place,i.dataset.qty,i.value));document.querySelectorAll("[data-add-lot]").forEach(b=>b.onclick=()=>{const id=b.dataset.addLot,qty=Number(document.querySelector(`[data-lot-qty="${id}"]`)?.value)||0,date=document.querySelector(`[data-lot-date="${id}"]`)?.value;if(!qty||!date)return;const k=lotKey(state.place,id);state.expiryLots={...state.expiryLots,[k]:[...getLots(state.place,id),{qty,date}]};render()});document.querySelectorAll("[data-remove-lot]").forEach(b=>b.onclick=()=>{const id=b.dataset.removeLot,k=lotKey(state.place,id),idx=Number(b.dataset.lotIndex);state.expiryLots={...state.expiryLots,[k]:getLots(state.place,id).filter((_,i)=>i!==idx)};render()});document.getElementById("fillMin").onclick=()=>{filteredProducts().forEach(p=>setQty(state.place,p.id,p.min));render()};document.getElementById("clearCat").onclick=()=>{filteredProducts().forEach(p=>setQty(state.place,p.id,0));render()};document.getElementById("saveCount").onclick=()=>{counts=[{id:`${state.locId}_${Date.now()}`,locId:state.locId,date:today(),place:state.place,items:PRODUCTS.map(p=>({productId:p.id,qty:Number(getQty(state.place,p.id))||0,place:state.place,lots:getLots(state.place,p.id),group:productGroup(p)})),aiReview:aiCountReviews[0]||null,createdAt:new Date().toISOString(),us     function pointView(){setTimeout(bindPoint);const mine=pointRecords.filter(p=>p.userId===state.user.id&&p.date===today()).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),actions=pointAllowedActions(mine),team=USERS.filter(u=>u.locations.includes(state.locId)&&u.role!=="director"),locPoints=pointRecords.filter(p=>p.locId===state.locId&&p.date===today()),requests=pointPauseAuths.filter(a=>a.locId===state.locId&&a.date===today()),g=geoConfig();return`<main class="content"><h1 class="pageTitle">Ponto</h1><p class="moduleIntro">Registro flexivel de jornada com trava de geolocalizacao. Consulta de escala e conteudos continua liberada fora do cinema.</p><section class="pointStatus"><small>Status atual</small><strong>${pointStatusText(mine)}</strong><p class="pointNote">Trava de ponto: ${esc(geoLabel())}</p>${state.geoError?`<p class="err">${esc(state.geoError)}</p>`:""}</section>${lead(state.user)?`<section class="panel"><h2>Geolocalizacao do cinema</h2><p class="moduleIntro">Configure no local físico do cinema. O raio recomendado e 5 metros.</p><div class="formGrid"><input id="geoRadius" type="number" min="5" value="${esc(g.radius||5)}" placeholder="Raio em metros"><button class="smallBtn" id="captureCinemaGeo">Definir ponto</button></div><p class="pointNote">${g.lat?`Configurado por ${esc(g.updatedBy||"lideranca")} - precisao ${esc(g.accuracy||"?")}m`:"Ainda sem coordenada configurada."}</p>${state.geoAdminMsg?`<span class="photoTag">${esc(state.geoAdminMsg)}</span>`:""}</section>`:""}<section class="panel"><h2>Registro de hoje</h2><div class="pointGrid">${actions.map(a=>a==="Solicitar pausa extra"?`<button data-extra-pause="1" class="next">Solicitar pausa extra</button>`:`<button data-point="${a}" class="next">${a}</button>`).join("")||`<button disabled>Jornada encerrada</button>`}</div><p class="pointNote">Para bater ponto, o navegador pedira permissao de localizacao.</p></section><section class="panel"><h2>Histórico do dia</h2>${mine.length?mine.map((p,i)=>`<di     function bindPoint(){bindGeoSettings();document.querySelectorAll("[data-point]").forEach(b=>b.onclick=()=>{const mine=pointRecords.filter(p=>p.userId===state.user.id&&p.date===today()).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),allowed=pointAllowedActions(mine);if(!allowed.includes(b.dataset.point))return;requestGeoForPoint(b.dataset.point)});const extra=document.querySelector("[data-extra-pause]");if(extra)extra.onclick=()=>{const pending=pointPauseAuths.some(a=>a.locId===state.locId&&a.date===today()&&a.userId===state.user.id&&a.status==="pending");if(pending)return;pointPauseAuths=[{id:`pause_${Date.now()}`,locId:state.locId,date:today(),userId:state.user.id,userName:state.user.name,status:"pending",createdAt:new Date().toISOString()},...pointPauseAuths];save("cineup_point_pause_auth_v1",pointPauseAuths);render()};document.querySelectorAll("[data-extra-approve]").forEach(b=>b.onclick=()=>{pointPauseAuths=pointPauseAuths.map(a=>a.id===b.dataset.extraApprove?{...a,status:"approved",approvedBy:state.user.name,approvedAt:new Date().toISOString()}:a);save("cineup_point_pause_auth_v1",pointPauseAuths);render()});document.querySelectorAll("[data-extra-reject]").forEach(b=>b.onclick=()=>{pointPauseAuths=pointPauseAuths.map(a=>a.id===b.dataset.extraReject?{...a,status:"rejected",approvedBy:state.user.name,approvedAt:new Date().toISOString()}:a);save("cineup_point_pause_auth_v1",pointPauseAuths);render()})}

    function importLocalData(data){if(!data||typeof data!=="object")return false;const map={tasks:"cineup_tasks_v1",checks:"cineup_checks_v1",counts:"cineup_counts_v1",tickets:"cineup_tickets_v1",movements:"cineup_movements_v1",pointRecords:"cineup_point_v1",rounds:"cineup_rounds_v1",occurrences:"cineup_occurrences_v1",notices:"cineup_notices_v1",handoffs:"cineup_handoffs_v1",sessionOps:"cineup_session_ops_v1",lostFound:"cineup_lostfound_v1",pointPauseAuths:"cineup_point_pause_auth_v1",inventoryAuths:"cineup_inventory_auth_v1",salesReports:"cineup_sales_reports_v1",aiCountReviews:"cineup_ai_count_reviews_v1",geoSettings:"cineup_geo_settings_v1",scheduleOverrides:"cineup_schedule_v1",floorPlans:"cineup_floor_v1",trainingMaterials:"cineup_training_v1",movieSchedule:"cineup_movies_v2"};Object.entries(map).forEach(([key,storeKey])=>{if(data[key]!==undefined)save(storeKey,data[key])});tasks=load("cineup_tasks_v1",[]);checks=load("cineup_checks_v1",[]);counts=load("cineup_counts_v1",[]);tickets=load("cineup_tickets_v1",[]);movements=load("cineup_movements_v1",[]);pointRecords=load("cineup_point_v1",[]);rounds=load("cineup_rounds_v1",[]);occurrences=load("cineup_occurrences_v1",[]);notices=load("cineup_notices_v1",[]);handoffs=load("cineup_handoffs_v1",[]);sessionOps=load("cineup_session_ops_v1",[]);lostFound=load("cineup_lostfound_v1",[]);pointPauseAuths=load("cineup_point_pause_auth_v1",[]);inventoryAuths=load("cineup_inventory_auth_v1",[]);salesReports=load("cineup_sales_reports_v1",[]);aiCountReviews=load("cineup_ai_count_reviews_v1",[]);geoSettings=load("cineup_geo_settings_v1",{});scheduleOverrides=load("cineup_schedule_v1",{});floorPlans=load("cineup_floor_v1",{});trainingMaterials=load("cineup_training_v1",defaultTrainingMaterials());movieSchedule=load("cineup_movies_v2",defaultMovieSchedule());return true}
    function bindPortableSettings(){bindSettings();bindSalesReport();bindInventoryAuths();bindDashboard();const inp=document.getElementById("importBackup");if(inp)inp.onchange=e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(importLocalData(data)){state.importMsg="Backup importado com sucesso.";render()}else{state.importMsg="Arquivo de backup invalido.";render()}}catch(err){state.importMsg=`Falha ao importar backup: ${err.message}`;render()}};reader.readAsText(file)}}
    function settings(){setTimeout(bindPortableSettings);const snap=appSnapshot(),locTasks=tasks.filter(t=>t.locId===state.locId),locChecks=checks.filter(c=>c.locId===state.locId),locCounts=counts.filter(c=>c.locId===state.locId),locTickets=tickets.filter(t=>t.locId===state.locId),sales=salesSummary();return`<main class="content"><h1 class="pageTitle">Administracao</h1><p class="moduleIntro">Painel de fechamento do MVP local e preparacao para uso mobile com painel web de consulta.</p><section class="actionList">${action("reports","▥","Relatorios","Indicadores da praca, equipe, estoque e vendas","info")}${action("maintenance","△","Manutencao","Chamados abertos e resolvidos","warn")}${action("programming","▶","Programacao","Cadastro e alarmes de sessoes","info")}${action("pendings","!","Pendências","Aprovacoes e solicitacoes de tarefa","warn")}</section><section class="focusGrid">${reportLine("Operação",`${locTasks.length} tarefas`,`${locTasks.filter(t=>["pending","redo","submitted"].includes(t.status)).length} abertas`,"hot")}${reportLine("Checklist",`${locChecks.length} vistorias`,"Histórico local salvo","green")}${reportLine("Estoque",`${locCounts.length} contagens`,"Mobile para operação, web para consulta","blue")}${reportLine("Vendas",money(Number(sales.total)||0),sales.source||"Sem importacao","green")}</section>${inventoryAuthPanel()}${isDirector()?`<section class="panel"><h2>Integracao Consciencia</h2><p class="moduleIntro">Caminho recomendado: importar relatorios exportados do Consciencia e cruzar com estoque, tarefas e fechamento. Integracao direta so deve entrar se houver API oficial ou exportacao automatica autorizada.</p><div class="materialForm"><div class="formGrid"><input id="salesTickets" type="number" step="0.01" value="${esc(state.salesTickets||"")}" placeholder="Total ingressos"><input id="salesBomboniere" type="number" step="0.01" value="${esc(state.salesBomboniere||"")}" placeholder="Total bomboniere"></div><div class="formGrid"><input id="salesT     function leadershipTask(t){
      const s=norm(`${t.sectorId||""} ${t.sectorName||""} ${t.text||t.title||""}`);
      return /planejamento_dia|planejamento do dia|montar plano de chao|registrar sessoes do dia|definir intervalos|observacoes gerais/.test(s);
    }
    function taskRelatedToUser(t,u=state.user){
      if(lead(u))return true;
      if(leadershipTask(t))return false;
      if(t.assigneeId===u.id)return true;
      if(t.requestById===u.id)return true;
      const mySector=userActiveSectorId(u);
      return !!mySector&&(t.assignedSectorId===mySector||(!t.assigneeId&&taskSector(t)===mySector));
    }
    function canExecuteTask(t,u=state.user){return !lead(u)&&!leadershipTask(t)&&["pending","redo"].includes(t.status)&&taskRelatedToUser(t,u)&&!(t.requestStatus==="pending"&&t.requestById===u.id&&!t.assigneeId)}

    function goalsView(){setTimeout(bindGoals);const g=todayGoal(),sales=salesSummary(),can=lead(state.user);return`<main class="content"><h1 class="pageTitle">Metas do Dia</h1><p class="moduleIntro">Expectativa operacional da unidade: público, vendas, bomboniere e foco comercial do turno.</p><section class="focusGrid">${goalMetric("Vendas",sales.total,g?.salesTarget,"R$ ")}${goalMetric("Bomboniere",sales.bomboniere,g?.bomboniereTarget,"R$ ")}${goalMetric("Ingressos",sales.tickets,g?.ticketSalesTarget,"R$ ")}${reportLine("Público esperado",String(g?.audienceTarget||0),g?.audienceNote||"Sem meta de público","blue")}</section>${g?`<section class="panel"><h2>Foco de hoje</h2><div class="historyCard"><strong>${esc(g.focus||"Sem foco definido")}</strong><small>${esc(g.userName||"Lideranca")} - ${new Date(g.updatedAt||g.createdAt).toLocaleString("pt-BR")}</small>${g.note?`<p class="pointNote">${esc(g.note)}</p>`:""}</div></section>`:""}${can?`<section class="panel"><h2>Definir metas</h2><div class="materialForm"><div class="formGrid"><input id="goalSales" type="number" step="0.01" value="${esc(state.goalSales||g?.salesTarget||"")}" placeholder="Meta vendas total"><input id="goalBomboniere" type="number" step="0.01" value="${esc(state.goalBomboniere||g?.bomboniereTarget||"")}" placeholder="Meta bomboniere"></div><div class="formGrid"><input id="goalTickets" type="number" step="0.01" value="${esc(state.goalTickets||g?.ticketSalesTarget||"")}" placeholder="Meta ingressos"><input id="goalAudience" type="number" value="${esc(state.goalAudience||g?.audienceTarget||"")}" placeholder="Público esperado"></div><input id="goalAudienceNote" value="${esc(state.goalAudienceNote||g?.audienceNote||"")}" placeholder="Base da expectativa: filme, clima, evento, histórico..."><input id="goalFocus" value="${esc(state.goalFocus||g?.focus||"")}" placeholder="Foco comercial/operacional do dia"><textarea id="goalNote" placeholder="Observacoes para a equipe e lideranca">${esc(state.goalNote||g?.note||"")}</textarea><button class="primary" id="saveGoal">Salvar metas do dia</button></div></section>`:""}<section class="panel"><h2>Histórico recente</h2>${dailyGoals.filter(x=>x.locId===state.locId).slice(0,8).map(x=>`<div class="historyCard"><strong>${esc(x.date.split("-").reverse().join("/"))} - ${esc(x.focus||"Sem foco")}</strong><small>Meta vendas ${money(goalNumber(x.salesTarget))} - Bomboniere ${money(goalNumber(x.bomboniereTarget))} - Público ${goalNumber(x.audienceTarget)}</small></div>`).join("")||`<p class="muted">Nenhuma meta registrada ainda.</p>`}</section></main>`}
    function bindGoals(){["goalSales","goalBomboniere","goalTickets","goalAudience","goalAudienceNote","goalFocus","goalNote"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{state.goalSales=document.getElementById("goalSales")?.value||"";state.goalBomboniere=document.getElementById("goalBomboniere")?.value||"";state.goalTickets=document.getElementById("goalTickets")?.value||"";state.goalAudience=document.getElementById("goalAudience")?.value||"";state.goalAudienceNote=document.getElementById("goalAudienceNote")?.value||"";state.goalFocus=document.getElementById("goalFocus")?.value||"";state.goalNote=document.getElementById("goalNote")?.value||""}});const b=document.getElementById("saveGoal");if(b)b.onclick=()=>{const old=todayGoal(),rec={id:old?.id||`goal_${state.locId}_${today()}`,locId:state.locId,date:today(),salesTarget:state.goalSales||old?.salesTarget||"",bomboniereTarget:state.goalBomboniere||old?.bomboniereTarget||"",ticketSalesTarget:state.goalTickets||old?.ticketSalesTarget||"",audienceTarget:state.goalAudience||old?.audienceTarget||"",audienceNote:state.goalAudienceNote||old?.audienceNote||"",focus:state.goalFocus||old?.focus||"",note:state.goalNote||old?.note||"",userId:state.user.id,userName:state.user.name,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};dailyGoals=[rec,...dailyGoals.filter(g=>!(g.locId===state.locId&&g.date===today()))];save("cineup_daily_goals_v1",dailyGoals);state.goalSales="";state.goalBomboniere="";state.goalTickets="";state.goalAudience="";state.goalAudienceNote="";state.goalFocus="";state.goalNote="";render()}}

    const operationMenuBeforeGoals=operationMenu;
    operationMenu=function(){setTimeout(bindDashboard);const html=operationMenuBeforeGoals();return html.replace('</section></main>',`${action("goals","◇","Metas do dia",lead(state.user)?"Definir e acompanhar expectativas":"Consultar foco e metas do turno","info")}</section></main>`)}

    const renderBeforeGoals=render;
    render=function(){if(!state.user)return renderLogin();if(state.user.locations.length>1&&!state.locId)return renderLocPicker();if(!canAccessView(state.view))state.view="dashboard";const body={dashboard:dashboard,operation:operationMenu,programming:programmingView,sessions:sessionsView,notices:noticesView,handoff:handoffView,rounds:roundsView,lostfound:lostFoundView,evidence:evidenceView,occurrences:occurrencesView,context:contextView,goals:goalsView,point:pointView,schedule:scheduleView,checklist:checklist,floor:floorView,inventory:inventory,pendings:pendingsView,team:teamMenu,collaborators:collaboratorsView,files:filesView,training:trainingView,teamTraining:teamTrainingView,assistant:assistantView,maintenance:maintenance,reports:reports,settings:settings}[state.view]();app.innerHTML=`<div class="shell">${topbar()}${body}${nav()}</div>`;bindCommon()}

    const dailyCloseSnapshotBeforeGoals=dailyCloseSnapshot;
    dailyCloseSnapshot=function(){const snap=dailyCloseSnapshotBeforeGoals();return{...snap,goals:todayGoal()}}
    const dailyCloseLinesBeforeGoals=dailyCloseLines;
    dailyCloseLines=function(s=dailyCloseSnapshot()){const base=dailyCloseLinesBeforeGoals(s),g=s.goals, sales=s.sales||{};return base+`\n\nMETAS DO DIA\n${g?`- Meta vendas: ${money(goalNumber(g.salesTarget))} | Real: ${money(goalNumber(sales.total))} | ${goalProgress(sales.total,g.salesTarget)}%\n- Meta bomboniere: ${money(goalNumber(g.bomboniereTarget))} | Real: ${money(goalNumber(sales.bomboniere))} | ${goalProgress(sales.bomboniere,g.bomboniereTarget)}%\n- Meta ingressos: ${money(goalNumber(g.ticketSalesTarget))} | Real: ${money(goalNumber(sales.tickets))} | ${goalProgress(sales.tickets,g.ticketSalesTarget)}%\n- Público esperado: ${goalNumber(g.audienceTarget)}\n- Foco: ${g.focus||"Não informado"}\n- Observacao: ${g.note||"Sem observacao"}`:"- Nenhuma meta registrada."}`}
    const dailyClosePanelBeforeGoals=dailyClosePanel;
    dailyClosePanel=function(){const html=dailyClosePanelBeforeGoals(),g=todayGoal(),sales=salesSummary();return html.replace('<div class="pendingActions">',`${g?`<div class="sectionTitle"><h2>Metas do dia</h2><small>${esc(g.focus||"Sem foco")}</small></div><div class="focusGrid">${goalMetric("Vendas",sales.total,g.salesTarget,"R$ ")}${goalMetric("Bomboniere",sales.bomboniere,g.bomboniereTarget,"R$ ")}${goalMetric("Ingressos",sales.tickets,g.ticketSalesTarget,"R$ ")}${reportLine("Público esperado",String(g.audienceTarget||0),g.audienceNote||"Sem base informada","blue")}</div>`:`<div class="historyCard"><strong>Metas do dia pendentes</strong><small>Defina metas para comparar expectativa e resultado no fechamento.</small></div>`}<div class="pendingActions">`)}

    const appSnapshotBeforeGoals=appSnapshot;
    appSnapshot=function(){return{...appSnapshotBeforeGoals(),dailyGoals}}
    const importLocalDataBeforeGoals=importLocalData;
    importLocalData=function(data){const ok=importLocalDataBeforeGoals(data);if(data&&data.dailyGoals!==undefined){save("cineup_daily_goals_v1",data.dailyGoals);dailyGoals=load("cineup_daily_goals_v1",[])}return ok}

    let openingRecords=load("cineup_opening_records_v1",[]);

    function cinePopLibrary(){
      return[
        {id:"POP-OP-001",title:"Plano de Chão Diário",area:"Operação / Gerência",criticality:"Alta",owner:"Gerente, subgerente ou responsável de turno",moment:"Antes da abertura — obrigatório até 30 min antes da abertura ao público",summary:"Define sessões, funções, intervalos, responsáveis e alertas do dia. Nenhuma área inicia sem Plano salvo.",rules:["Plano salvo no APP até 30 minutos antes da abertura ao público.","Funções críticas sem responsável (Cabine, Bilheteria, Portaria) bloqueiam abertura — sem exceção.","Cabine e projeção são exclusivamente responsabilidade da gerência.","Troca de função durante o turno exige registro com horário e motivo.","Plano com falta não antecipada exige solução antes de salvar.","Alteração pós-abertura registrada com horário e responsável.","Portaria de reforço ativada apenas em dois picos simultâneos ou sala acima de 150 pessoas."],check:["1. Programação do dia conferida: filmes, salas, horários, versões, classificações.","2. Equipe presente confirmada: folgas e faltas tratadas antes do Plano.","3. Funções críticas atribuídas — sem responsável não abre.","4. Intervalos distribuídos sem cobrir pico.","5. Classificações restritas e legendados destacados para Bilheteria e Portaria.","6. Responsáveis pelo fechamento definidos e cientes.","7. Plano salvo no APP com horário de registro confirmado."]},
        {id:"POP-OP-002",title:"Abertura Operacional da Unidade",area:"Abertura / Gerência",criticality:"Crítica",owner:"Gerência da unidade",moment:"Sequência obrigatória antes da entrada do público",summary:"Libera ou bloqueia a abertura verificando fisicamente cada setor crítico na ordem correta: Playlist → Cabine → Sala → Portaria → Bilheteria. KDM é conferida toda Quarta e Quinta-feira.",rules:["A ordem dos itens é obrigatória: Playlist antes de Cabine, Cabine antes de Sala, Sala antes de Portaria, Portaria antes de Bilheteria.","Item crítico não conforme bloqueia abertura — não existe ressalva para os 5 primeiros itens.","Abertura com ressalva (item não crítico): justificativa + responsável + prazo máximo de 2 horas.","Foto obrigatória em qualquer não conformidade, antes da correção.","Gerência valida abertura presencialmente — não por telefone ou mensagem.","Horário de abertura ao público só pode ser antecipado com autorização da diretoria."],check:["1. Playlist conferida no TMS: sequência trailers + filme + créditos na ordem correta para cada sala.","2. Cabine testada: projetar imagem e áudio por 30 segundos em cada sala — verificar da última fileira.","3. Temperatura das salas entre 22°C e 24°C. Acima de 25°C = não conformidade. Ar-condicionado ligado há pelo menos 45 minutos.","4. Salas limpas: zero lixo visível, piso seco, poltronas sem avaria, saídas de emergência desobstruídas.","5. Banheiros: papel (mín. 2 rolos/cabine), sabão (nível mínimo 30%), papel toalha. Piso seco.","6. Foyer e rampa: limpos, secos, rota PCD desobstruída.","7. Bombonière: geladeiras 1-8°C, pipoca pronta, troco mínimo R$150, sistema aberto.","8. Portaria: ao menos 1 colaborador certificado no posto 1 com briefing da programação.","9. Gerência valida e registra abertura no APP com horário."]},
        {id:"POP-SES-001",title:"Controle Operacional do Ciclo da Sessão",area:"Sessões / Portaria / Gerência",criticality:"Crítica",owner:"Portaria, apoio, cabine (gerência) e liderança",moment:"Antes, durante e após cada sessão — sequência obrigatória por sala",summary:"Cada sessão tem 6 fases sequenciais obrigatórias: preparação, conferência, entrada, exibição, ronda, pós-sessão. Nenhuma fase pode ser pulada.",rules:["Sala só abre para entrada após conclusão das fases 1 e 2.","Início da projeção exige confirmação de imagem e som — sem confirmação não há início.","Ronda realizada entre 5 e 15 minutos após início da exibição — fora dessa janela é não conformidade.","Falha de som ou imagem percebida pelo público vira ocorrência sem exceção.","Sala só é liberada para próxima sessão após limpeza conferida e registrada.","Tempo máximo entre saída do último cliente e liberação: 20 min (salas até 150 lugares) / 30 min (acima de 150)."],check:["FASE 1 — PRÉ-SESSÃO: Sala limpa do ciclo anterior, temperatura 22-24°C, poltronas sem lixo ou avaria, saídas desobstruídas.","FASE 2 — LIBERAÇÃO: Portaria informada sobre sala, horário, classificação e versão. Status liberado no APP.","FASE 3 — ENTRADA: Ingressos conferidos 1:1. Classificação verificada na entrada. Alimentos externos bloqueados.","FASE 4 — INÍCIO: Cabine confirma imagem e som antes do primeiro trailer. Registro no APP ou diário de cabine.","FASE 5 — RONDA: Entre 5 e 15 min após início. Verificar: barulho externo, falha áudio/imagem, cliente com mal-estar. Registrar no APP.","FASE 6 — PÓS-SESSÃO: Orientar saída. Verificar achados e perdidos. Limpeza iniciada imediatamente. Liberação da sala registrada no APP."]},
        {id:"POP-CHK-001",title:"Checklist com Evidência e Não Conformidade",area:"Auditoria / Operação",criticality:"Crítica",owner:"Executor designado e aprovador autorizado",moment:"Abertura, sessão, pico, fechamento e auditoria",summary:"Padroniza execução e registro de checklists. Conforme, Não Conforme e N/A com critério explícito. N/A por conveniência é não conformidade.",rules:["Conforme: verificado fisicamente e dentro dos parâmetros do POP.","Não Conforme: verificado fisicamente e fora do padrão. Exige comentário com o desvio observado.","N/A: somente quando o item genuinamente não se aplica à unidade ou ao turno. N/A por conveniência é NC.","Foto obrigatória em qualquer item crítico marcado como não conforme — antes da correção.","Item crítico não conforme gera pendência automática com responsável e prazo obrigatórios.","Checklist aprovado pelo gerente valida verificação física, não de memória.","Reincidência no mesmo item por 3 turnos consecutivos: escalar para diretoria."],check:["Todos os itens obrigatórios respondidos (Conforme, NC ou N/A justificado).","Itens não conformes com comentário descritivo do desvio observado.","Foto antes da correção para itens críticos não conformes.","Responsável e prazo definidos para cada pendência gerada.","Foto após correção para itens críticos.","Checklist salvo e enviado para aprovação antes do fim da fase.","Reincidência no mesmo item escalada para diretoria."]},
        {id:"POP-EMERG-001",title:"Emergência, Evacuação e Resposta Imediata",area:"Emergência / Segurança / Operação / Gerência",criticality:"Crítica",owner:"Gerente ou responsável de turno (comando único)",moment:"Qualquer situação com risco imediato a pessoas ou patrimônio",summary:"Resposta a emergências com ações concretas nos primeiros 60 segundos. Números de emergência, script de rádio, ponto de encontro e contagem de equipe.",rules:["NÚMEROS DE EMERGÊNCIA: SAMU 192 | Corpo de Bombeiros 193 | Polícia Militar 190 | Defesa Civil 199. Afixar na cabine e na sala de gerência.","Comando único: o gerente ou responsável de turno assume o comando. Ninguém age sem comunicar o responsável.","Nunca proibir saída de cliente. Orientar verbalmente — não usar força física.","Parar a projeção é decisão do responsável de turno — portaria não para sessão por conta própria.","Ponto de encontro externo: área aberta sem risco de queda de estrutura, mínimo 20 metros da entrada. Definir por unidade e afixar no vestiário.","Registro no APP e contato com diretoria ocorrem somente após estabilização — nunca durante a emergência ativa.","Todos os colaboradores participam de simulação de evacuação ao menos uma vez por semestre."],check:["MINUTO 1 — AVALIAÇÃO: Identificar tipo (incêndio, queda de energia, mal-súbito, briga, ameaça, falha estrutural). Acionar responsável de turno.","MINUTO 1 — PARAR SESSÃO se risco ao público. Comunicar pelo rádio comunicador: Atenção equipe, evacuação em andamento, posicionar nas saídas.","MINUTOS 1-3 — ACIONAR EMERGÊNCIA: SAMU se vítima. Bombeiros se fogo ou fumaça. PM se conflito ou ameaça.","MINUTOS 1-5 — ORIENTAR SAÍDA: Equipe nas saídas das salas e na saída externa. Prioridade: PCD, crianças, idosos. NUNCA usar elevador em incêndio.","APÓS SAÍDA — CONTAGEM DE EQUIPE: Responsável confirma presença de todos os colaboradores no ponto de encontro.","APÓS ESTABILIZAÇÃO: Registrar ocorrência no APP com tipo, horário, pessoas envolvidas, ações tomadas, serviços acionados.","INCÊNDIO: Não usar extintor se fogo acima de 1m² ou fumaça densa. Evacuar e aguardar Bombeiros."]},
        {id:"POP-CLASS-001",title:"Classificação Indicativa, Menores e Conflitos na Entrada",area:"Bilheteria / Portaria / Gerência",criticality:"Crítica",owner:"Bilheteria (venda) e Portaria (entrada)",moment:"Venda, retirada e controle de entrada",summary:"Classificação indicativa em dois pontos de controle. Regras por faixa etária, documentos aceitos e scripts de atendimento para os três conflitos mais frequentes.",rules:["Acompanhamento: Livre e 10 anos — sem documento. 12 e 14 anos — acompanhamento de responsável legal. 16 anos — idem. 18 anos — documento obrigatório sem exceção.","Classificação não é opinião do funcionário. Não cabe discussão sobre o mérito — aplica a lei.","Bilheteria é o primeiro controle. Portaria é o segundo. Os dois são obrigatórios.","Documentos aceitos: RG, certidão de nascimento, CNH (16+). Foto no celular não é documento válido.","Não fotografar documento pessoal do cliente sem política de privacidade aprovada.","Conflito não resolvido em 2 minutos: escalar para gerência. Portaria não resolve sozinha.","Registrar todo conflito de classificação: data, hora, filme, descrição, resultado."],check:["Bilheteria: filmes com classificação 12+ identificados no sistema e na comunicação visual do caixa.","Portaria: briefing diário sobre filmes restritos, horários e versões recebido antes da abertura.","CONFLITO TIPO 1 — Pai/mãe com filho menor em filme 18 anos: Script: 'Este filme tem classificação 18 anos. Pela legislação, não é permitida a entrada mesmo com acompanhamento. Posso verificar outros filmes?' Sem negociação. Escalar se insistir.","CONFLITO TIPO 2 — Sem documento para filme 16 anos: Script: 'Para esta classificação precisamos confirmar a idade. Sem documento não consigo liberar a entrada — é uma exigência legal.' Escalar se insistir.","CONFLITO TIPO 3 — Cliente alega que filho tem quase a idade: Script: 'Entendo, mas a classificação é uma exigência legal e não posso fazer exceção. Posso verificar filmes disponíveis para a faixa etária dele.' Escalar se insistir.","Após qualquer conflito escalado: registrar ocorrência no APP com tipo, filme, resultado e ação.","Acompanhamento válido (12, 14, 16 anos): verificar se adulto é o responsável legal. Em dúvida razoável, solicitar confirmação verbal e registrar."]},
        {id:"POP-PORT-001",title:"Portaria e Controle de Acesso",area:"Portaria / Controle de Acesso",criticality:"Crítica",owner:"Colaborador de portaria certificado",moment:"Antes, durante e após sessões",summary:"Padroniza conferência de ingresso, sala, horário, versão, classificação, controle de alimentos externos, rondas e limpeza do corredor.",rules:["Não liberar sala sem status liberado no APP.","Não abandonar posto durante entrada de público.","Divergência de ingresso (sala errada, horário errado, sessão encerrada) interrompe entrada e chama gerência.","Ronda a cada 15 minutos durante exibição — registrada no APP.","Limpeza do corredor nos intervalos entre sessões, não apenas no fechamento.","Alimentos externos: seguir política da unidade. Não criar conflito — escalar para gerência."],check:["Portaria conhece programação completa: filmes, salas, horários, versões, classificações.","Ingressos conferidos 1:1 na entrada — não visual.","Classificação e versão orientadas ao cliente na entrada.","Rondas realizadas a cada 15 minutos e registradas no APP.","Limpeza de corredor realizada nos intervalos.","Ocorrência aberta para qualquer situação relevante."]},
        {id:"POP-SALA-001",title:"Limpeza, Conferência e Liberação de Salas",area:"Salas / Limpeza / Portaria",criticality:"Crítica",owner:"Zeladoria e liderança",moment:"Antes da entrada, após sessão e fechamento",summary:"Nenhuma sala é liberada sem conferência física. Piso seco, poltronas limpas, saídas livres, temperatura adequada.",rules:["Pressão de horário não justifica sala suja ou insegura — atrasar sessão se necessário.","Sala suja ou insegura bloqueia entrada sem exceção.","Piso molhado, risco de queda ou poltrona avariada exigem pendência e foto.","Temperatura da sala deve estar entre 22°C e 24°C antes da entrada do público.","Tempo máximo de limpeza: 20 min para salas até 150 lugares, 30 min para salas acima de 150.","Achados e perdidos verificados antes de iniciar limpeza — item de valor para gerência imediatamente."],check:["Sala sem lixo visível: piso, poltronas, porta-copos.","Piso seco — qualquer líquido no piso é NC crítica.","Poltronas: sem avaria estrutural, sem mancha relevante, porta-copos funcionando.","Temperatura entre 22°C e 24°C.","Saídas de emergência desobstruídas e sinalizadas.","Limpeza registrada no APP — sala liberada somente após registro."]}
      ]

    function popCard(p){return`<article class="trainingCard"><strong>${esc(p.id)} - ${esc(p.title)}</strong><small>${esc(p.summary)}</small><div class="trainingMeta"><span>${esc(p.area)}</span><span>${esc(p.criticality)}</span><span>${esc(p.moment)}</span></div><p class="pointNote">Responsavel: ${esc(p.owner)}</p><ul class="clean">${p.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul><div class="miniList">${p.check.map(c=>`<div class="miniItem"><strong>${esc(c)}</strong><small>Item mínimo do POP</small></div>`).join("")}</div></article>`}
    function popsView(){const pops=cinePopLibrary();return`<main class="content"><h1 class="pageTitle">Biblioteca de POPs</h1><p class="moduleIntro">Procedimentos oficiais transformados em regra de operação, checklist, tarefas, bloqueios e indicadores.</p><section class="metricGrid">${metric("POPs",pops.length,"blue","POP")}${metric("Criticos",pops.filter(p=>p.criticality==="Crítica").length,"red","!")}${metric("Com bloqueio",2,"gold","✓")}${metric("Vinculados",4,"green","☑")}</section><section class="panel"><h2>Procedimentos carregados</h2>${pops.map(popCard).join("")}</section></main>`}

      {id:"pipoqueira",name:"Pipoqueira",critical:true,items:["Equipamento limpo","Equipamento funcionando","Insumos disponiveis","Pipoca inicial preparada","Area limpa e segura"]},

    function serviceTypeLabel(t){return({complaint:"Reclamacao",accessibility:"Acessibilidade",accident:"Acidente",near_miss:"Quase acidente",misconduct:"Conduta/atendimento",technical:"Falha de sessao",maintenance:"Risco/manutencao",cleaning:"Limpeza crítica",lost:"Achados e perdidos",other:"Outro atendimento"})[t]||"Registro"}

    function bindService(){["serviceType","servicePlace","servicePeople","serviceNote","serviceAction"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{state.serviceType=document.getElementById("serviceType")?.value||"complaint";state.servicePlace=document.getElementById("servicePlace")?.value||"";state.servicePeople=document.getElementById("servicePeople")?.value||"";state.serviceNote=document.getElementById("serviceNote")?.value||"";state.serviceAction=document.getElementById("serviceAction")?.value||""}});const saveBtn=document.getElementById("saveService");if(saveBtn)saveBtn.onclick=()=>{const type=state.serviceType||"complaint",priority=servicePriority(type),file=document.getElementById("servicePhoto")?.files?.[0],rec={id:`srv_${Date.now()}`,locId:state.locId,date:today(),type,place:state.servicePlace||"",people:state.servicePeople||"",note:state.serviceNote||"",action:state.serviceAction||"",photo:file?appCameraPhoto(file.name):"",priority,userId:state.user.id,userName:state.user.name,createdAt:new Date().toISOString()};serviceRecords=[rec,...serviceRecords];save("cineup_service_records_v1",serviceRecords);occurrences=[{id:`srv_occ_${Date.now()}`,locId:state.locId,date:today(),title:`${serviceTypeLabel(type)} - ${rec.place||"Operação"}`,type:serviceTypeLabel(type),severity:priority,place:rec.place||"Operação",note:[rec.people,rec.note].filter(Boolean).join(" - "),action:rec.action||"Registro criado em Atendimento e Seguranca.",followUp:priority==="high",userId:state.user.id,userName:state.user.name,createdAt:new Date().toISOString()},...occurrences];save("cineup_occurrences_v1",occurrences);if(priority==="high"){tickets=[{id:`srv_ticket_${Date.now()}`,locId:state.locId,title:`${serviceTypeLabel(type)} - ${rec.place||"Operação"}`,area:rec.place||"Atendimento/Seguranca",priority:"high",status:"open",note:rec.action||rec.note||"Registro crítico exige acompanhamento.",photo:rec.photo,userId:state.user.id,userName:state.user.name,source:"Ate     function certProblem(userId,area,positionId=""){const c=currentCert(userId,area);if(!c)return criticalCertAreas().has(area)?`sem certificacao em ${area}`:"";if(c.validUntil&&c.validUntil<today())return`certificacao vencida em ${area}`;if(["blocked","failed","expired","suspended"].includes(c.status))return`${certStatusLabel(c.status)} em ${area}`;if(c.status==="assisted"&&!c.supervisor)return`apto acompanhado em ${area}, mas sem supervisor definido`;if(c.status==="restricted"&&c.restriction)return`restricao em ${area}: ${c.restriction}`;if(positionId==="cabine"){const u=USERS.find(x=>x.id===userId);if(u&&!lead(u))return"cabine exige lideranca/gerencia responsavel"}return""}

        criticality:ptBRText(p.criticality),
        owner:ptBRText(p.owner),
        moment:ptBRText(p.moment),
        summary:ptBRText(p.summary),
        rules:(p.rules||[]).map(ptBRText),
        check:(p.check||[]).map(ptBRText)
      };
    }
    function popAreaName(p){
      return ptBRText(String(p.area||"Geral").split("/")[0].trim()||"Geral");
    }
    function popSearchText(p){
      return norm([p.id,p.title,p.area,p.criticality,p.owner,p.moment,p.summary,...(p.rules||[]),...(p.check||[])].join(" "));
    }
    function popCompactCard(p,selected){
      return `<button class="quick ${selected?"active":""}" data-pop-open="${esc(p.id)}"><i>POP</i><span><strong>${esc(p.id)} - ${esc(p.title)}</strong><small>${esc(p.area)} · ${esc(p.criticality)}</small></span></button>`;
    }
    function popFullPanel(p){
      if(!p)return `<section class="panel"><h2>POP na íntegra</h2><p class="muted">Selecione um procedimento para visualizar o conteúdo completo.</p></section>`;
      return `<section class="panel"><h2>POP na íntegra</h2><article class="trainingCard"><strong>${esc(p.id)} - ${esc(p.title)}</strong><small>${esc(p.summary)}</small><div class="trainingMeta"><span>${esc(p.area)}</span><span>${esc(p.criticality)}</span><span>${esc(p.moment)}</span></div><p class="pointNote"><strong>Responsável:</strong> ${esc(p.owner)}</p><details open><summary>Regras operacionais</summary><ul class="clean">${p.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></details><details open><summary>Checklist mínimo</summary><div class="miniList">${p.check.map((c,i)=>`<div class="miniItem"><strong>${i+1}. ${esc(c)}</strong><small>Item obrigatório do POP</small></div>`).join("")}</div></details></article></section>`;
    }
    function bindPops(){
      const search=document.getElementById("popSearch");
      if(search)search.oninput=()=>{state.popSearch=search.value;render()};
      const area=document.getElementById("popArea");
      if(area)area.onchange=()=>{state.popArea=area.value;state.popSelectedId="";render()};
      document.querySelectorAll("[data-pop-open]").forEach(b=>b.onclick=()=>{state.popSelectedId=b.dataset.popOpen;render()});
      if(typeof mobileEnhanceInputs==="function")mobileEnhanceInputs();
    }
    popsView=function(){
      setTimeout(bindPops);
      const pops=operationalPopLibrary().map(popDisplay);
      const areas=["Todas",...[...new Set(pops.map(popAreaName))].sort((a,b)=>a.localeCompare(b,"pt-BR"))];
      const area=state.popArea||"Todas",query=norm(state.popSearch||"");
      let filtered=pops.filter(p=>(area==="Todas"||popAreaName(p)===area)&&(!query||popSearchText(p).includes(query)));
      if(!filtered.length)filtered=pops.filter(p=>area==="Todas"||popAreaName(p)===area);
      const selected=filtered.find(p=>p.id===state.popSelectedId)||filtered[0]||null;
      const grouped=filtered.reduce((acc,p)=>{const key=popAreaName(p);(acc[key]||(acc[key]=[])).push(p);return acc},{});
      const list=Object.keys(grouped).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(group=>`<section class="panel"><h2>${esc(group)}</h2>${grouped[group].map(p=>popCompactCard(p,selected&&selected.id===p.id)).join("")}</section>`).join("");
      return `<main class="content"><h1 class="pageTitle">Biblioteca de POPs</h1><p class="moduleIntro">Consulta operacional organizada por área. Use a busca ou toque em um POP para abrir o procedimento na íntegra.</p><section class="metricGrid">${metric("POPs",pops.length,"blue","POP")}${metric("Críticos",pops.filter(p=>p.criticality==="Crítica").length,"red","!")}${metric("Áreas",areas.length-1,"gold","▤")}${metric("Filtrados",filtered.length,"green","ok")}</section><section class="panel"><h2>Encontrar POP</h2><div class="materialForm"><input id="popSearch" value="${esc(state.popSearch||"")}" placeholder="Buscar por código, área, assunto ou palavra-chave"><select id="popArea">${areas.map(a=>`<option ${area===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div><p class="pointNote">Os documentos técnicos continuam ocultos da equipe; aqui aparecem apenas POPs operacionais.</p></section>${popFullPanel(selected)}${list||`<section class="panel"><p class="muted">Nenhum POP encontrado para esse filtro.</p></section>`}</main>`;
    };
    const teamMenuBeforePopUsability=teamMenu;
    teamMenu=function(){
      let html=teamMenuBeforePopUsability();
      html=html.replace("Biblioteca de POPs\",\"Procedimentos oficiais e regras do app","POPs\",\"Procedimentos oficiais por área, com consulta na íntegra");
      return html;
    };

    let supabasePendingsLastSync="";
    function supabaseUserId(id){return USERS.some(u=>u.id===id)?id:null}
    function ticketToPendingRow(t){return{id:String(t.id),loc_id:t.locId||state.locId,pending_date:t.date||today(),title:t.title||t.text||"Pendencia",area:t.area||t.sectorName||t.source||"Operacao",status:t.status==="approved"?"done":(t.status||"open"),severity:t.severity||t.priority||"medium",due_date:t.dueDate||null,assignee_id:supabaseUserId(t.assigneeId),note:t.note||"",action_note:t.actionNote||"",evidence_url:t.photo||t.evidenceUrl||"",source:t.source||"Manual",created_by:supabaseUserId(t.userId),approved_by:supabaseUserId(t.approvedById)}}
    function pendingRowToTicket(r){const assignee=USERS.find(u=>u.id===r.assignee_id),creator=USERS.find(u=>u.id===r.created_by);return{id:r.id,locId:r.loc_id,date:r.pending_date||today(),title:r.title,area:r.area||"Operacao",severity:r.severity||"medium",priority:r.severity==="critical"?"high":(r.severity||"medium"),dueDate:r.due_date||"",status:r.status==="approved"?"done":(r.status||"open"),note:r.note||"",actionNote:r.action_note||"",photo:r.evidence_url||"",assigneeId:r.assignee_id||"",assigneeName:assignee?.name||"",userId:r.created_by||"",userName:creator?.name||"Supabase",source:r.source||"Supabase",createdAt:r.created_at||new Date().toISOString(),updatedAt:r.updated_at||new Date().toISOString(),remote:true}}
    function mergeRemotePendings(rows){const remote=rows.map(pendingRowToTicket),byId=new Map(tickets.map(t=>[t.id,t]));remote.forEach(t=>byId.set(t.id,{...(byId.get(t.id)||{}),...t}));tickets=[...byId.values()].sort((a,b)=>String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")));save("cineup_tickets_v1",tickets)}
    async function upsertPendingRemote(t){if(!supabaseClient)return;const {error}=await supabaseClient.from("pendings").upsert(ticketToPendingRow(t),{onConflict:"id"});state.supabasePendingStatus=error?`Erro Supabase: ${error.message}`:"Pendencia sincronizada com Supabase"}
    async function syncLocalPendingsToSupabase(){if(!supabaseClient||!state.locId)return;const local=tickets.filter(t=>t.locId===state.locId&&["Manual","Checklist","Estoque","Plano de Chao","Plano de Chão","Supabase"].includes(t.source||"Manual"));for(const t of local.slice(0,50))await upsertPendingRemote(t)}
    async function syncPendingsFromSupabase(force=false){if(!supabaseClient||!state.locId){state.supabasePendingStatus="Supabase indisponivel neste navegador";return}const key=`${state.locId}_${Math.floor(Date.now()/20000)}`;if(!force&&supabasePendingsLastSync===key)return;supabasePendingsLastSync=key;state.supabasePendingStatus="Sincronizando pendencias...";const {data,error}=await supabaseClient.from("pendings").select("*").eq("loc_id",state.locId).order("updated_at",{ascending:false}).limit(200);if(error){state.supabasePendingStatus=`Erro Supabase: ${error.message}`;if(state.view==="pendings")render();return}mergeRemotePendings(data||[]);await syncLocalPendingsToSupabase();state.supabasePendingStatus=`Supabase sincronizado: ${(data||[]).length} registro(s)`;if(state.view==="pendings")render()}
    function supabasePendingPanel(){const ok=supabaseClient&&!String(state.supabasePendingStatus||"").startsWith("Erro");return`<section class="panel ${ok?"":"danger"}"><h2>Supabase</h2><p class="muted">${esc(state.supabasePendingStatus||"Pronto para sincronizar pendencias entre aparelhos.")}</p><button class="smallBtn" id="syncPendingsNow">Atualizar agora</button></section>`}
    const pendingsViewBeforeSupabase=pendingsView;
    pendingsView=function(){setTimeout(()=>syncPendingsFromSupabase(false));const html=pendingsViewBeforeSupabase();return html.replace('<section class="metricGrid">',`${supabasePendingPanel()}<section class="metricGrid">`)};
    const bindPendingsBeforeSupabase=bindPendings;
    bindPendings=function(){bindPendingsBeforeSupabase();const syncNow=document.getElementById("syncPendingsNow");if(syncNow)syncNow.onclick=()=>syncPendingsFromSupabase(true);const saveBtn=document.getElementById("saveManualPending");if(saveBtn)saveBtn.onclick=()=>{manualPendingDefaults();if(!String(state.pendingTitle||"").trim()){state.pendingError="Informe o titulo da pendencia.";render();return}if(!state.pendingDue){state.pendingError="Defina um prazo.";render();return}const file=document.getElementById("pendingEvidence")?.files?.[0],u=USERS.find(x=>x.id===state.pendingAssignee);const rec={id:`manual_${Date.now()}`,locId:state.locId,date:today(),title:state.pendingTitle.trim(),area:state.pendingArea||"Operacao",severity:state.pendingSeverity||"medium",priority:state.pendingSeverity==="critical"?"high":state.pendingSeverity||"medium",dueDate:state.pendingDue||today(),status:"open",note:state.pendingNote||"",photo:file?prototypePhoto(file.name):"",assigneeId:u?.id||"",assigneeName:u?.name||"",userId:state.user.id,userName:state.user.name,source:"Manual",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};tickets=[rec,...tickets];save("cineup_tickets_v1",tickets);state.pendingTitle="";state.pendingNote="";state.pendingError="";upsertPendingRemote(rec);render()};function updateTicketAndSync(id,patch){let changed=null;tickets=tickets.map(t=>t.id===id?(changed={...t,...patch,updatedAt:new Date().toISOString()}):t);save("cineup_tickets_v1",tickets);if(changed)upsertPendingRemote(changed);render()}document.querySelectorAll("[data-ticket-submit-evidence]").forEach(b=>b.onclick=()=>updateTicketAndSync(b.dataset.ticketSubmitEvidence,{status:"submitted",photo:prototypePhoto(tickets.find(t=>t.id===b.dataset.ticketSubmitEvidence)?.title||"Pendencia"),actionNote:"Evidencia anexada no prototipo",submittedAt:new Date().toISOString(),submittedBy:state.user.id,submittedByName:state.user.name}));document.querySelectorAll("[data-ticket-approve]").forEach(b=>b.onclick=()=>updateTicketAndSync(b.dataset.ticketApprove,{status:"done",approvedAt:new Date().toISOString(),approvedBy:state.user.name,approvedById:state.user.id}));document.querySelectorAll("[data-ticket-reject]").forEach(b=>b.onclick=()=>updateTicketAndSync(b.dataset.ticketReject,{status:"rejected",rejectedAt:new Date().toISOString(),rejectedBy:state.user.name}));document.querySelectorAll("[data-ticket-reopen]").forEach(b=>b.onclick=()=>updateTicketAndSync(b.dataset.ticketReopen,{status:"reopened",reopenedAt:new Date().toISOString(),reopenedBy:state.user.name}))};

    const settingsBeforeRemoteDb=settings;
    settings=function(){
      const panel=`<section class="panel"><h2>Banco geral Supabase</h2><p class="muted">${esc(state.remoteDbStatus||"Sincronizacao geral pronta. Todas as chaves cineup_* serao espelhadas no Supabase.")}</p><button class="primary" id="syncAllRemote">Sincronizar banco geral agora</button></section>`;
      return settingsBeforeRemoteDb().replace("</main>",`${panel}</main>`);
    };
    document.addEventListener("click",e=>{if(e.target?.id==="syncAllRemote"){state.remoteDbStatus="Sincronizando banco geral...";cineupSyncAllFromSupabase(true).then(()=>render())}});

    render();
    setTimeout(()=>cineupSyncAllFromSupabase(false),700);
  </script>
</body>
</html>
